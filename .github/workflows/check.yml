name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Saymo runs on the Mac and on Windows, so every change is checked on
    # both: a change that works on one only fails here.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Next writes the route types (RouteContext, LayoutProps) first; a fresh
      # checkout has none until then.
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Mac and Windows
        run: node scripts/studio/platform-check.mjs
      - name: Word-based editing
        run: node scripts/studio/edit-check.mjs
      - name: Sketch on the frame
        run: node scripts/studio/sketch-check.mjs
      - name: Effects
        run: node scripts/studio/parts-check.mjs
